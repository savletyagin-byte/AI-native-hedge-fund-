[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-hedge-fund"
version = "0.1.0"
description = "Advanced AI-native hedge fund research and execution framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Quant Lab" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
